apply plugin: 'com.android.application'

android {
    namespace = "dev.minibook.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.minibook.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "0.2.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    androidResources {
        noCompress += ['gz', 'bin', 'onnx']
    }
    applicationVariants.configureEach { variant ->
        variant.mergeAssetsProvider.configure {
            doLast {
                def srcG2p = file("src/main/assets/public/kokoro-g2p/v1")
                def dstG2p = new File(outputDir.get().asFile, "public/kokoro-g2p/v1")
                if (srcG2p.exists()) {
                    dstG2p.mkdirs()
                    dstG2p.listFiles()?.each { it.delete() }
                    copy {
                        from srcG2p
                        into dstG2p
                    }
                }
            }
        }
    }
    signingConfigs {
        release {
            storeFile file('minibook-release.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // MiniBook native HTTP/WS, SAF DocumentFile, and Media3 ReadAloudService + ExoPlayer
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.media3:media3-common:1.5.1"
    implementation "androidx.media3:media3-datasource:1.5.1"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-extractor:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.32.0"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
